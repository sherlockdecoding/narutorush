<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shinobi Rush: Final Awakening</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Rajdhani:wght@500;700&display=swap');
        body { margin: 0; overflow: hidden; background: #020205; font-family: 'Permanent Marker', cursive; touch-action: none; }
        canvas { display: block; margin: 0 auto; }
        #ui { position: absolute; top: env(safe-area-inset-top, 20px); left: 0; right: 0; pointer-events: none; padding: 0 20px; z-index: 50; font-family: 'Rajdhani', sans-serif; }
        #controls { position: absolute; bottom: env(safe-area-inset-bottom, 30px); left: 0; right: 0; display: flex; justify-content: space-around; z-index: 50; }
        .ctrl-btn {
            width: 85px; height: 85px; border-radius: 50%; border: 3px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.6); color: white; display: flex; flex-direction: column;
            align-items: center; justify-content: center; font-size: 11px; pointer-events: auto;
            backdrop-filter: blur(10px); box-shadow: 0 0 20px rgba(0,0,0,0.5); transition: 0.1s;
            user-select: none; -webkit-tap-highlight-color: transparent; font-family: 'Rajdhani', sans-serif; font-weight: 700; letter-spacing: 1px;
        }
        .ctrl-btn:active { transform: scale(0.9); border-color: #ff9d00; background: rgba(255, 157, 0, 0.2); }
        .ctrl-btn.depleted { opacity: 0.35; filter: grayscale(1); }
        #hp-fill { width: 100%; height: 100%; background: linear-gradient(90deg, #ff4d4d, #ff0000); transition: 0.3s; }
        #chakra-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #4facfe, #00f2fe); transition: 0.15s; }
        #overlay { position: absolute; inset: 0; background: url('Startmenu.png') center/cover no-repeat; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; z-index: 100; text-align: center; padding: 20px; padding-bottom: 20px; }        #title-txt { position: absolute; top: 33%; left: 0; right: 0; transform: translateY(-50%); }        @keyframes flashRed { 0% { background: #000; } 50% { background: #300; } 100% { background: #000; } }
        #combo-txt { font-family: 'Permanent Marker', cursive; transition: transform 0.15s, opacity 0.15s; }
        .stat-row { display:flex; justify-content:space-between; width:220px; font-family:'Rajdhani',sans-serif; font-size:15px; color:#9ca3af; letter-spacing:1px; text-transform:uppercase; padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.08); }
        .stat-row b { color:#fff; font-size:17px; }
        #vignette { position:absolute; inset:0; pointer-events:none; z-index:40; box-shadow: inset 0 0 140px 40px rgba(0,0,0,0.7); }
        #low-hp-pulse { position:absolute; inset:0; pointer-events:none; z-index:41; box-shadow: inset 0 0 100px 20px rgba(255,0,0,0); transition: box-shadow 0.3s; }
        @keyframes overlayIn { from { opacity:0; transform: scale(0.96); } to { opacity:1; transform: scale(1); } }
        #overlay.show-anim { animation: overlayIn 0.4s ease-out; }
        #debug-panel { position: absolute; bottom: 4px; left: 4px; z-index: 999; font-family: monospace; font-size: 10px; color: #0f0; background: rgba(0,0,0,0.7); padding: 4px 6px; border-radius: 4px; pointer-events: none; white-space: pre; display: none; }
    </style>
</head>
<body>
    <div id="ui">
        <div class="flex justify-between items-start">
            <div>
                <div class="text-[10px] text-orange-400 uppercase tracking-[0.2em] mb-1">Health</div>
                <div class="w-44 h-4 bg-white/5 border-2 border-white/20 rounded-full overflow-hidden">
                    <div id="hp-fill"></div>
                </div>
                <div class="text-[9px] text-sky-400 uppercase tracking-[0.2em] mt-2 mb-1">Chakra</div>
                <div class="w-44 h-2.5 bg-white/5 border border-white/20 rounded-full overflow-hidden">
                    <div id="chakra-fill"></div>
                </div>
                <div id="kurama-bar"><div id="kurama-fill"></div></div>
            </div>
            <div class="text-right">
                <div id="phase-label" class="text-[10px] text-gray-400 uppercase tracking-[0.3em] mb-1">Infiltration</div>
                <div class="text-4xl text-white italic glow"><span id="dist">0</span>M</div>
                <div class="text-sm text-orange-300 italic mt-1">SCORE <span id="score">0</span></div>
                <div id="combo-txt" class="text-lg text-yellow-300 italic mt-1 opacity-0">COMBO x0</div>
            </div>
        </div>
    </div>

    <div id="vignette"></div>
    <div id="low-hp-pulse"></div>
    <div id="debug-panel"></div>

    <div id="controls">
        <div id="btn-dash" class="ctrl-btn">
            <span class="text-2xl mb-1">⚡</span>
            <span>SHUNSHIN</span>
        </div>
        <div id="btn-attack" class="ctrl-btn" style="border-color: #4facfe;">
            <span class="text-2xl mb-1">🌀</span>
            <span>JUTSU</span>
        </div>
    </div>

    <div id="overlay">
        <h1 id="title-txt" class="text-5xl text-orange-500 mb-2 italic glow">SHINOBI RUSH</h1>
        <p id="desc-txt" class="text-gray-400 mb-6 max-w-xs uppercase tracking-[0.1em]">Tap START to awaken the Will of Fire</p>
        <div id="stats-box" class="hidden flex flex-col mb-6"></div>
        <<button id="start-btn" class="bg-transparent border-0 p-0 transition-all active:scale-95">
            <img src="Startbtn.png" alt="Start Mission" class="w-64 h-64 object-contain" style="filter: drop-shadow(0 4px 12px rgba(0,0,0,0.6));">
        </button>
        <p id="best-txt" class="text-[10px] text-gray-600 mt-6 uppercase italic"></p>
    </div>

    <canvas id="game"></canvas>

    <script>
        // ============================================================
        // IMAGE LOADING
        // ============================================================
    const images = {};
    const imageSources = {
    narutoRun: '\u200bnaruto-run.png',
    narutoJutsu: '\u200bnaruto-jutsu.png',
    kuramaRun: '1000022158.png',
    kuramaJutsu: '1000022161.png',
    enemyShinobi: '1000022167.png',
    sasuke: '1000022170.png',
    itachiBase: '1000022174.png',
    itachiAttack: '1000022176.png',
    background: 'Background.png'
};

        // Explicit frame counts for sprite sheets. FIX: the previous code guessed
        // whether an image was a multi-frame sheet by comparing width to height
        // (width > height * 1.5). That heuristic silently failed for the Naruto
        // run/jutsu sheets (their aspect ratio didn't clear the threshold), which
        // is why they rendered squished or blank while Kurama's sheets (which
        // happened to pass the check) looked fine.
        //
        // If your actual PNGs use a different layout than assumed below
        // (e.g. narutoRun.png is really a single static image, not 4 frames),
        // just change the number here — nothing else needs to change.
        const spriteFrames = {
            narutoRun: 4,   // confirmed: genuine 4-frame sheet, evenly spaced
            kuramaRun: 4,
            narutoJutsu: 1, // confirmed: single pose on an oversized padded canvas
            kuramaJutsu: 1
        };

        // Track per-image load state explicitly instead of just counting successes.
        // This lets us tell the difference between "still loading" and "404/broken".
        const imageStatus = {};
        let imagesLoaded = 0;
        let imagesFailed = 0;
        const totalImages = Object.keys(imageSources).length;

        for (let key in imageSources) {
            images[key] = new Image();
            imageStatus[key] = 'loading';
            images[key].onload = () => {
                imageStatus[key] = 'ok';
                imagesLoaded++;
                const frames = spriteFrames[key] || 1;
                // Sanity check: warn if a "multi-frame" sheet's width isn't evenly
                // divisible by its declared frame count — a strong sign the frame
                // count is wrong and slicing will look broken.
                if (frames > 1 && images[key].naturalWidth % frames !== 0) {
                    console.warn(
                        `[sprite warning] ${key} (${imageSources[key]}) is ${images[key].naturalWidth}px wide ` +
                        `but declared as ${frames} frames — width isn't evenly divisible. ` +
                        `Check spriteFrames["${key}"] in the code.`
                    );
                }
                // Auto-trim transparent padding so characters aren't drawn small
                // inside an oversized canvas. For single-frame images this crops
                // tightly to content. For multi-frame sheets (frames laid out
                // side-by-side), only the vertical range is reliable to reuse
                // across all frames — horizontal cropping stays per-frame slicing.
                const box = computeBBox(images[key]);
                if (box) imageBBox[key] = box;
            };
            images[key].onerror = () => {
                imageStatus[key] = 'error';
                imagesFailed++;
                console.error(`[image error] Failed to load "${key}" from "${imageSources[key]}". ` +
                    `Check that this file exists in the same folder as the HTML file and the filename matches exactly (case-sensitive).`);
            };
            images[key].src = imageSources[key];
        }

        function imgReady(key) {
            const img = images[key];
            return img && img.complete && img.naturalWidth !== 0 && imageStatus[key] === 'ok';
        }

        // Some source PNGs are exported on an oversized canvas with a lot of
        // transparent padding around the actual character (e.g. narutoJutsu.png
        // is 677x369 but the character only occupies a 234x328 region in the
        // middle). Drawing the whole padded canvas squished into a small box
        // makes the character look tiny/off — so for single-frame images we
        // detect the real content box once on load and crop to it when drawing.
        const imageBBox = {};
        function computeBBox(img) {
            const c = document.createElement('canvas');
            c.width = img.naturalWidth; c.height = img.naturalHeight;
            const cctx = c.getContext('2d');
            cctx.drawImage(img, 0, 0);
            let data;
            try {
                data = cctx.getImageData(0, 0, c.width, c.height).data;
            } catch (err) {
                return null; // e.g. tainted canvas if loaded cross-origin
            }
            let minX = c.width, minY = c.height, maxX = -1, maxY = -1;
            for (let y = 0; y < c.height; y++) {
                for (let x = 0; x < c.width; x++) {
                    if (data[(y * c.width + x) * 4 + 3] > 10) {
                        if (x < minX) minX = x;
                        if (x > maxX) maxX = x;
                        if (y < minY) minY = y;
                        if (y > maxY) maxY = y;
                    }
                }
            }
            if (maxX < minX || maxY < minY) return null;
            return { x: minX, y: minY, w: maxX - minX + 1, h: maxY - minY + 1 };
        }
        // Draws a source region (sx,sy,sw,sh) fit into a destination box (dx,dy,dw,dh)
        // while PRESERVING aspect ratio (unlike plain ctx.drawImage with fixed w/h,
        // which stretches/squishes — a big contributor to characters looking "skinny"
        // or distorted). Anchored to bottom-center, like feet standing on the ground.
        function drawFit(img, sx, sy, sw, sh, dx, dy, dw, dh) {
            const srcRatio = sw / sh, dstRatio = dw / dh;
            let fw, fh;
            if (srcRatio > dstRatio) { fw = dw; fh = dw / srcRatio; } else { fh = dh; fw = dh * srcRatio; }
            const fx = dx + (dw - fw) / 2;
            const fy = dy + (dh - fh);
            ctx.drawImage(img, sx, sy, sw, sh, fx, fy, fw, fh);
        }
        // Draws an image, auto-cropped to its trimmed content box (removing transparent
        // padding), fit into (dx,dy,dw,dh) preserving aspect ratio.
        // For a sprite-sheet frame, keep the per-frame horizontal slice but reuse
        // the whole-sheet's vertical content bounds (imageBBox) to trim shared
        // top/bottom padding — this is what makes a run-sheet frame fill its box
        // as fully as a single trimmed image like Sasuke's.
        function frameSourceRect(key, frameIndex, frameWidth, frameHeight) {
            const box = imageBBox[key];
            return { sx: frameIndex * frameWidth, sy: box ? box.y : 0, sw: frameWidth, sh: box ? box.h : frameHeight };
        }
        function drawTrimmed(img, key, dx, dy, dw, dh) {
            const box = imageBBox[key];
            const sx = box ? box.x : 0, sy = box ? box.y : 0;
            const sw = box ? box.w : img.naturalWidth, sh = box ? box.h : img.naturalHeight;
            drawFit(img, sx, sy, sw, sh, dx, dy, dw, dh);
        }

        // ============================================================
        // AUDIO
        // ============================================================
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioCtx();
        let musicPlaying = false;
        let musicInterval;
        let bossMode = false;

        // Background music now plays an actual audio file instead of the
        // procedurally-generated synth loop. Keep same file next to index.html.
        const bgMusic = new Audio('Narutomusic.mp3');
        bgMusic.loop = true;
        bgMusic.volume = 0.5;
        bgMusic.addEventListener('error', () => {
            console.error(
                '[music] Failed to load "Narutomusic.mp3". Make sure the file is uploaded ' +
                'to the same folder as index.html and the filename matches exactly (case-sensitive).'
            );
        });

        const Music = {
            start: function() {
                if (musicPlaying) return;
                musicPlaying = true;
                bgMusic.currentTime = 0;
                bgMusic.playbackRate = 1;
                // play() must be called from a user-gesture context (e.g. the
                // START MISSION button handler) or mobile browsers will block it.
                bgMusic.play().catch(err => console.warn('[music] play() blocked or failed:', err));
            },
            retune: function() {
                if (!musicPlaying) return;
                // Speed up slightly during the boss fight for extra tension,
                // instead of switching to a different track.
                bgMusic.playbackRate = bossMode ? 1.12 : 1;
            },
            stop: function() {
                musicPlaying = false;
                bgMusic.pause();
            }
        };

        const Sfx = {
            dash: () => {
                const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            },
            jutsu: (isPower) => {
                const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                osc.type = isPower ? 'sawtooth' : 'sine';
                osc.frequency.setValueAtTime(isPower ? 100 : 800, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.3);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            },
            deny: () => {
                const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(180, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(90, audioCtx.currentTime + 0.12);
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 0.12);
            },
            hit: () => {
                const bufferSize = audioCtx.sampleRate * 0.1;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;
                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                noise.connect(gain); gain.connect(audioCtx.destination);
                noise.start();
            },
            kill: (pitchBoost) => {
                [440, 660, 880].forEach((f, i) => {
                    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                    osc.frequency.setValueAtTime(f * pitchBoost, audioCtx.currentTime + i * 0.04);
                    gain.gain.setValueAtTime(0.1, audioCtx.currentTime + i * 0.04);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + i * 0.04 + 0.18);
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.start(audioCtx.currentTime + i * 0.04);
                    osc.stop(audioCtx.currentTime + i * 0.04 + 0.18);
                });
            },
            powerup: () => {
                [440, 660, 880].forEach((f, i) => {
                    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                    osc.frequency.setValueAtTime(f, audioCtx.currentTime + i * 0.05);
                    gain.gain.setValueAtTime(0.1, audioCtx.currentTime + i * 0.05);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + i * 0.05 + 0.2);
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.start(audioCtx.currentTime + i * 0.05);
                    osc.stop(audioCtx.currentTime + i * 0.05 + 0.2);
                });
            },
            warning: () => {
                const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(140, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.6);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 0.6);
            },
            telegraph: () => {
                const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(900, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 0.15);
            },
            explosion: () => {
                const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(100, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(40, audioCtx.currentTime + 1);
                gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 1);
            }
        };

        // ============================================================
        // CORE STATE
        // ============================================================
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const hpFill = document.getElementById('hp-fill');
        const chakraFill = document.getElementById('chakra-fill');
        const distTxt = document.getElementById('dist');
        const scoreTxt = document.getElementById('score');
        const comboTxt = document.getElementById('combo-txt');
        const kuramaFill = document.getElementById('kurama-fill');
        const phaseLabel = document.getElementById('phase-label');
        const overlay = document.getElementById('overlay');
        const statsBox = document.getElementById('stats-box');
        const bestTxt = document.getElementById('best-txt');
        const lowHpPulse = document.getElementById('low-hp-pulse');
        const debugPanel = document.getElementById('debug-panel');

        // Set ?debug=1 in the URL to see live image-load status on screen.
        const DEBUG = new URLSearchParams(location.search).get('debug') === '1';
        if (DEBUG) debugPanel.style.display = 'block';

        const V_WIDTH = 400;
        let V_HEIGHT = 800;
        let scale = 1;

        let state = 'MENU';
        let sessionBest = { score: 0, distance: 0 };
        let player = {
            x: 60, y: 0, targetX: 60, side: 0, hp: 100,
            kuramaMode: 0, kuramaMax: 400, sasukeTimer: 0, trail: [],
            width: 40, height: 60, finisher: false, finisherX: 0, finisherY: 0, defaultY: 0,
            chakra: 100, chakraMax: 100, attackAnim: 0, attackAnimMax: 12
        };

        let entities = [];
        let particles = [];
        let floaters = [];
        let leaves = [];
        let roofs = [];
        let clouds = [];
        let distance = 0;
        let score = 0;
        let combo = 0;
        let comboTimer = 0;
        let frameCount = 0;
        let shake = 0;
        let punch = 0;
        let hitStop = 0;
        let jutsuFlash = 0;
        let itachiRef = null;
        let bossWarned = false;

        function resize() {
            scale = Math.min(window.innerWidth / V_WIDTH, window.innerHeight / 800);
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            V_HEIGHT = window.innerHeight / scale;
            player.defaultY = V_HEIGHT - 180;
            if (!player.finisher) player.y = player.defaultY;
        }

        function vibrate(ms) { if (navigator.vibrate) navigator.vibrate(ms); }

        function spawnPart(x, y, color, count=5, speed=8) {
            for(let i=0; i<count; i++) {
                particles.push({ x, y, vx: (Math.random()-0.5)*speed, vy: (Math.random()-0.5)*speed, life: 1, c: color, s: Math.random()*4 + 2 });
            }
        }
        function spawnFloater(x, y, text, color) { floaters.push({ x, y, text, color, life: 1, vy: -1.4 }); }
        function addScore(amount, x, y) {
            score += amount; scoreTxt.innerText = score;
            if (x !== undefined) spawnFloater(x, y, '+' + amount, '#fbbf24');
        }
        function registerKill(x, y, isBoss) {
            combo++; comboTimer = 100;
            const bonus = 50 + combo * 10;
            addScore(bonus, x, y);
            comboTxt.innerText = 'COMBO x' + combo;
            comboTxt.style.opacity = combo > 1 ? '1' : '0';
            comboTxt.style.transform = 'scale(1.25)';
            setTimeout(() => { comboTxt.style.transform = 'scale(1)'; }, 150);
            Sfx.kill(1 + Math.min(combo, 8) * 0.05);
            vibrate(isBoss ? 40 : 15);
        }
        function breakCombo() { if (combo > 0) { combo = 0; comboTimer = 0; comboTxt.style.opacity = '0'; } }

        function initGame() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            bossMode = false;
            Music.start();
            state = 'PLAY';
            player.hp = 100; player.chakra = 100; player.kuramaMode = 0; player.sasukeTimer = 0;
            player.finisher = false; player.side = 0; player.targetX = 60; player.x = 60; player.y = player.defaultY;
            player.attackAnim = 0;
            distance = 0; score = 0; combo = 0; comboTimer = 0;
            entities = []; particles = []; floaters = [];
            itachiRef = null; bossWarned = false; frameCount = 0;
            punch = 0; hitStop = 0; jutsuFlash = 0;
            overlay.style.display = 'none';
            document.body.classList.remove('flash-red');
            // FIX: chakra bar previously stayed visually empty at game start
            // because its width was never set to match player.chakra (100).
            chakraFill.style.width = player.chakra + '%';
            document.getElementById('btn-attack').classList.remove('depleted');
            phaseLabel.innerText = "Infiltration";
            comboTxt.style.opacity = '0';
            scoreTxt.innerText = '0';
            lowHpPulse.style.boxShadow = 'inset 0 0 100px 20px rgba(255,0,0,0)';
            leaves = [];
            for(let i=0; i<14; i++) leaves.push({ x: Math.random()*V_WIDTH, y: Math.random()*V_HEIGHT, r: Math.random()*Math.PI*2, s: Math.random()*0.6+0.5, sway: Math.random()*Math.PI*2, sz: Math.random()*4+4 });
            roofs = [];
            for(let i=0; i<6; i++) roofs.push({ x: i*90 - 40, y: 300 + Math.random()*20, w: 70, lantern: Math.random() > 0.4 });
            clouds = [];
            for(let i=0; i<5; i++) clouds.push({x: Math.random()*V_WIDTH, y: Math.random()*200+20, w: Math.random()*60+40, s: Math.random()*0.3+0.1});
        }

        function update() {
            if (state !== 'PLAY') return;
            if (player.finisher) { updateFinisher(); return; }
            if (hitStop > 0) { hitStop--; return; }
            frameCount++;
            distance += 1.2;
            if (shake > 0) shake *= 0.85;
            if (punch > 0) punch *= 0.8;
            if (jutsuFlash > 0) jutsuFlash -= 0.08;
            if (player.attackAnim > 0) player.attackAnim--;
            player.x += (player.targetX - player.x) * 0.25;
            player.trail.push({x: player.x, y: player.y});
            if (player.trail.length > 6) player.trail.shift();
            if (player.kuramaMode > 0) {
                player.kuramaMode--;
                kuramaFill.style.width = (player.kuramaMode / player.kuramaMax * 100) + '%';
            } else { kuramaFill.style.width = '0%'; }
            if (player.sasukeTimer > 0) {
                player.sasukeTimer--;
                // FIX: chidori_senbon was referenced in damage/collision/draw code
                // but never actually spawned anywhere — Sasuke never fired. Now he
                // periodically shoots senbon from his position while active.
                if (frameCount % 25 === 0) {
                    const sasukeX = player.x + (player.side === 0 ? 70 : -70) + 20;
                    const sasukeY = player.y + 20;
                    entities.push({ type: 'chidori_senbon', x: sasukeX, y: sasukeY });
                    spawnPart(sasukeX, sasukeY, '#4facfe', 4, 3);
                    Sfx.telegraph();
                }
            }
            if (player.chakra < player.chakraMax) {
                player.chakra = Math.min(player.chakraMax, player.chakra + 0.16);
                chakraFill.style.width = player.chakra + '%';
                document.getElementById('btn-attack').classList.toggle('depleted', player.chakra < 20);
            }
            if (comboTimer > 0) { comboTimer--; if (comboTimer === 0) breakCombo(); }

            lowHpPulse.style.boxShadow = player.hp < 30
                ? 'inset 0 0 ' + (60 + Math.sin(frameCount*0.25)*30) + 'px 20px rgba(255,0,0,' + (0.35 + Math.sin(frameCount*0.25)*0.15) + ')'
                : 'inset 0 0 100px 20px rgba(255,0,0,0)';

            clouds.forEach(c => { c.x -= c.s; if (c.x < -80) c.x = V_WIDTH + 80; });
            roofs.forEach(r => { r.x -= 2.2; if (r.x < -100) r.x = V_WIDTH + 40; });
            leaves.forEach(l => {
                l.y += l.s * 1.6; l.sway += 0.03; l.x += Math.sin(l.sway) * 0.8; l.r += 0.02;
                if (l.y > V_HEIGHT + 20) { l.y = -20; l.x = Math.random()*V_WIDTH; }
            });

            if (distance < 1200) {
                if (frameCount % 100 === 0) {
                    const items = ['ramen', 'scroll', 'bandage'];
                    const type = items[Math.floor(Math.random() * items.length)];
                    const laneX = Math.random() > 0.5 ? 60 : 300;
                    entities.push({ type, x: laneX + 20, y: -50 });
                }
                if (frameCount % 40 === 0) {
                    entities.push({ type: 'shinobi', x: Math.random() * 300 + 50, y: -50, hp: 1 });
                    if (Math.random() < 0.25) entities.push({ type: 'shuriken', x: Math.random() * V_WIDTH, y: -50 });
                }
            }
            if (Math.floor(distance) >= 1200 && !itachiRef) {
                itachiRef = { type: 'itachi', x: 200, y: -100, targetX: 200, hp: 300, maxHp: 300, phase: 1, phaseAnnounced: false, fireRate: 50 };
                entities.push(itachiRef);
                phaseLabel.innerText = "The Final Confrontation";
                bossMode = true; Music.retune(); Sfx.powerup();
            }
            if (itachiRef && itachiRef.hp <= 150 && !itachiRef.phaseAnnounced) {
                itachiRef.phaseAnnounced = true; itachiRef.phase = 2; itachiRef.fireRate = 30;
                phaseLabel.innerText = "Mangekyō Unleashed";
                shake = 25; punch = 1; Sfx.warning();
                spawnFloater(itachiRef.x, itachiRef.y - 40, 'SHARINGAN!', '#ff3333');
            }

            for (let i = entities.length - 1; i >= 0; i--) {
                let e = entities[i];
                if (['ramen', 'scroll', 'bandage'].includes(e.type)) {
                    const dx = (player.x + 20) - e.x, dy = (player.y + 30) - e.y;
                    if (Math.sqrt(dx*dx + dy*dy) < 150) { e.x += dx * 0.35; e.y += dy * 0.35; }
                }
                if (['rasenshuriken', 'beast_bomb', 'chidori_senbon'].includes(e.type)) {
                    e.y -= 25;
                } else if (e.type === 'itachi') {
                    e.y += (150 - e.y) * 0.05;
                    if (frameCount % 60 === 0) e.targetX = 100 + Math.random() * 200;
                    e.x += (e.targetX - e.x) * 0.08;
                    const rate = e.fireRate;
                    const untilFire = rate - (frameCount % rate);
                    e.telegraph = untilFire <= 15;
                    if (e.telegraph && untilFire === 15) Sfx.telegraph();
                    if (frameCount % rate === 0) {
                        const count = e.phase === 2 ? 6 : (e.hp < 150 ? 5 : 3);
                        for(let k=0; k<count; k++) entities.push({ type: 'kunai', x: e.x + (k - Math.floor(count/2))*40, y: e.y + 30 });
                    }
                } else { e.y += 12; }

                const pdx = (player.x + 20) - e.x, pdy = (player.y + 30) - e.y;
                const pdist = Math.sqrt(pdx*pdx + pdy*pdy);
                const isPickup = ['ramen', 'scroll', 'bandage'].includes(e.type);
                if (pdist < (isPickup ? 60 : 45)) {
                    if (['shuriken', 'shinobi', 'kunai'].includes(e.type)) {
                        if (player.kuramaMode <= 0) {
                            player.hp -= 15; shake = 15; punch = 0.6; hitStop = 4; Sfx.hit();
                            spawnPart(e.x, e.y, '#f00', 10);
                            vibrate(25); breakCombo();
                            entities.splice(i, 1);
                        } else { spawnPart(e.x, e.y, '#ff0', 5); entities.splice(i, 1); }
                    } else if (e.type === 'ramen') {
                        player.hp = Math.min(100, player.hp + 40);
                        addScore(10, e.x, e.y); Sfx.powerup(); entities.splice(i, 1);
                    } else if (e.type === 'scroll') {
                        player.kuramaMode = player.kuramaMax; player.chakra = player.chakraMax;
                        addScore(20, e.x, e.y); shake = 10; Sfx.powerup();
                        spawnPart(player.x+20, player.y+30, '#ff8000', 20); entities.splice(i, 1);
                    } else if (e.type === 'bandage') {
                        player.sasukeTimer = 600; addScore(15, e.x, e.y); Sfx.powerup(); entities.splice(i, 1);
                    }
                }
                if (['rasenshuriken', 'beast_bomb', 'chidori_senbon'].includes(e.type)) {
                    entities.forEach(target => {
                        if (['shinobi', 'itachi'].includes(target.type)) {
                            if (Math.sqrt((e.x - target.x)**2 + (e.y - target.y)**2) < 65) {
                                const dmg = e.type === 'beast_bomb' ? 60 : (e.type === 'rasenshuriken' ? 25 : 10);
                                target.hp -= dmg; e.dead = true;
                                spawnPart(target.x, target.y, '#4facfe', 12);
                                if (target.type !== 'itachi') { Sfx.hit(); } else { hitStop = 3; punch = 0.4; }
                            }
                        }
                    });
                }
                if (e.type === 'shinobi' && e.hp <= 0 && !e.counted) { e.counted = true; registerKill(e.x, e.y, false); }
                if (e.type === 'itachi' && e.hp <= 0) { registerKill(e.x, e.y, true); startFinisher(e); entities.splice(i, 1); }
                else if (e.y < -300 || e.y > V_HEIGHT + 300 || e.hp <= 0 || e.dead) { entities.splice(i, 1); }
            }
            floaters.forEach((f, i) => { f.y += f.vy; f.life -= 0.02; if (f.life <= 0) floaters.splice(i, 1); });
            hpFill.style.width = player.hp + '%';
            distTxt.innerText = Math.floor(distance);
            if (frameCount % 30 === 0) addScore(1);
            if (player.hp <= 0) gameOver();

            if (DEBUG && frameCount % 15 === 0) {
                let lines = [`frame ${frameCount}  loaded ${imagesLoaded}/${totalImages}  failed ${imagesFailed}`];
                for (let k in imageSources) {
                    lines.push(`${k}: ${imageStatus[k]}${imgReady(k) ? ' ' + images[k].naturalWidth + 'x' + images[k].naturalHeight : ''}`);
                }
                debugPanel.innerText = lines.join('\n');
            }
        }

        function startFinisher(target) {
            player.finisher = true; player.finisherX = target.x; player.finisherY = target.y; player.finisherStep = 0;
            entities = [];
            document.body.classList.add('flash-red');
            Sfx.powerup();
        }
        function updateFinisher() {
            player.finisherStep++;
            if (player.finisherStep === 60) {
                shake = 80; punch = 1.4;
                spawnPart(player.finisherX, player.finisherY, '#fff', 200, 30);
                spawnPart(player.finisherX, player.finisherY, '#4facfe', 200, 35);
                document.body.classList.remove('flash-red');
                Sfx.explosion();
            } else if (player.finisherStep < 60) {
                player.x += (player.finisherX - 20 - player.x) * 0.35;
                player.y += (player.finisherY - 30 - player.y) * 0.35;
            } else if (player.finisherStep > 130) { showWinScreen(); }
            if (shake > 0) shake *= 0.9;
            if (punch > 0) punch *= 0.85;
        }

        function renderStats() {
            sessionBest.score = Math.max(sessionBest.score, score);
            sessionBest.distance = Math.max(sessionBest.distance, Math.floor(distance));
            statsBox.classList.remove('hidden');
            statsBox.innerHTML =
                '<div class="stat-row"><span>Distance</span><b>' + Math.floor(distance) + 'm</b></div>' +
                '<div class="stat-row"><span>Score</span><b>' + score + '</b></div>' +
                '<div class="stat-row"><span>Best Combo</span><b>x' + Math.max(combo,1) + '</b></div>';
            bestTxt.innerText = 'SESSION BEST — ' + sessionBest.score + ' PTS · ' + sessionBest.distance + 'M';
            overlay.classList.remove('show-anim'); void overlay.offsetWidth; overlay.classList.add('show-anim');
        }
        function showWinScreen() {
            state = 'MENU'; Music.stop(); bossMode = false; overlay.style.display = 'flex';
            document.getElementById('title-txt').innerText = "MISSION SUCCESS";
            document.getElementById('title-txt').style.color = "#4facfe";
            document.getElementById('desc-txt').innerText = "Itachi has fallen. The village is safe.";
            renderStats();
        }
        function gameOver() {
            state = 'MENU'; Music.stop(); bossMode = false; overlay.style.display = 'flex';
            document.getElementById('title-txt').innerText = "MISSION FAILED";
            document.getElementById('title-txt').style.color = "#ff4d4d";
            document.getElementById('desc-txt').innerText = "The Will of Fire flickers... try again.";
            renderStats();
            Sfx.hit();
        }

        // ============================================================
        // RENDERING
        // ============================================================
        // Character draw sizes — bumped up from the originals (70x90 / 90x110 / etc.)
        // for better visual presence. All are (width, height) with the origin at
        // the character's translate point (feet-ish center), matching how each
        // draw call below positions them (-w/2, -h*ratio, w, h).
        const SIZE = {
            playerRun:   { w: 104, h: 132 },
            playerJutsu: { w: 148, h: 180 },
            enemy:       { w: 88,  h: 114 },
            sasuke:      { w: 88,  h: 114 },
            itachi:      { w: 112, h: 128 }
        };

        function drawPlayer(kMode) {
            const lean = Math.max(-10, Math.min(10, (player.targetX - player.x) * 0.28));
            const isAttacking = player.attackAnim > 0 || player.finisher;

            ctx.save();
            ctx.translate(player.x + 20, player.y + 30);
            ctx.rotate(lean * Math.PI / 180);

            if (kMode) {
                ctx.save();
                ctx.globalAlpha = 0.5 + Math.sin(frameCount * 0.3) * 0.2;
                ctx.shadowBlur = 30; ctx.shadowColor = '#ff3300';
                ctx.restore();
            }

            if (isAttacking) {
                // FIX: use explicit sprite key + spriteFrames instead of the old
                // aspect-ratio guess, and slice the jutsu sheet into frames too
                // (previously it always drew the whole sheet as one static image).
                const jutsuKey = kMode ? 'kuramaJutsu' : 'narutoJutsu';
                if (imgReady(jutsuKey)) {
                    const img = images[jutsuKey];
                    const frames = spriteFrames[jutsuKey] || 1;
                    const jw = SIZE.playerJutsu.w, jh = SIZE.playerJutsu.h;
                    if (frames > 1) {
                        const progress = 1 - (player.attackAnim / player.attackAnimMax); // 0 -> 1 over the swing
                        const frameIndex = Math.min(frames - 1, Math.floor(progress * frames));
                        const frameWidth = img.naturalWidth / frames;
                        const frameHeight = img.naturalHeight;
                        { const r = frameSourceRect(jutsuKey, frameIndex, frameWidth, frameHeight); drawFit(img, r.sx, r.sy, r.sw, r.sh, -jw / 2, -jh * 0.62, jw, jh); }
                    } else {
                        drawTrimmed(img, jutsuKey, -jw / 2, -jh * 0.62, jw, jh);
                    }
                } else {
                    // Fallback visual if jutsu image hasn't loaded / failed to load
                    ctx.fillStyle = kMode ? '#ff3300' : '#4facfe';
                    ctx.beginPath(); ctx.arc(0, 0, 35, 0, 7); ctx.fill();
                }
            } else {
                const sheetKey = kMode ? 'kuramaRun' : 'narutoRun';
                if (imgReady(sheetKey)) {
                    const sheet = images[sheetKey];
                    const frames = spriteFrames[sheetKey] || 1;
                    const rw = SIZE.playerRun.w, rh = SIZE.playerRun.h;
                    if (frames > 1) {
                        const frameIndex = Math.floor(frameCount / 6) % frames;
                        const frameWidth = sheet.naturalWidth / frames;
                        const frameHeight = sheet.naturalHeight;
                        { const r = frameSourceRect(sheetKey, frameIndex, frameWidth, frameHeight); drawFit(sheet, r.sx, r.sy, r.sw, r.sh, -rw / 2, -rh * 0.5, rw, rh); }
                    } else {
                        drawTrimmed(sheet, sheetKey, -rw / 2, -rh * 0.5, rw, rh);
                    }
                } else {
                    // Fallback visual if run image hasn't loaded / failed to load
                    ctx.fillStyle = kMode ? '#ff8000' : '#f97316';
                    ctx.fillRect(-SIZE.playerRun.w * 0.29, -SIZE.playerRun.h * 0.33, SIZE.playerRun.w * 0.58, SIZE.playerRun.h * 0.67);
                }
            }

            ctx.restore();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            const punchScale = 1 + punch * 0.045;
            ctx.translate(canvas.width/2, canvas.height/2);
            ctx.scale(scale * punchScale, scale * punchScale);
            ctx.translate(-V_WIDTH/2, -V_HEIGHT/2);
            if (shake > 0) ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);

            const kMode = player.kuramaMode > 0;
            if (imgReady('background')) {
                ctx.drawImage(images.background, 0, 0, V_WIDTH, V_HEIGHT);
                // optional tint overlay so kurama/boss mode still reads visually
                if (kMode || bossMode) {
                    ctx.fillStyle = kMode ? 'rgba(120,20,0,0.35)' : 'rgba(10,5,20,0.35)';
                    ctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);
                }
            } else {
                const bg = ctx.createLinearGradient(0, 0, 0, V_HEIGHT);
                if (kMode) { bg.addColorStop(0, '#2a0a05'); bg.addColorStop(1, '#0a0202'); }
                else if (bossMode) { bg.addColorStop(0, '#0a0510'); bg.addColorStop(1, '#020205'); }
                else { bg.addColorStop(0, '#050510'); bg.addColorStop(1, '#020205'); }
                ctx.fillStyle = bg; ctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);
        }
            // moon
            ctx.save(); ctx.globalAlpha = 0.9;
            ctx.fillStyle = bossMode ? '#ff5555' : '#f1f5ff';
            ctx.shadowBlur = 25; ctx.shadowColor = ctx.fillStyle;
            ctx.beginPath(); ctx.arc(V_WIDTH - 60, 70, 26, 0, 7); ctx.fill();
            ctx.restore();

            // clouds
            ctx.fillStyle = 'rgba(255,255,255,0.05)';
            clouds.forEach(c => { ctx.beginPath(); ctx.ellipse(c.x, c.y, c.w, c.w*0.35, 0, 0, 7); ctx.fill(); });

            
            

            // speed streak lines (near layer)
            ctx.strokeStyle = kMode ? 'rgba(150,0,0,0.5)' : 'rgba(255,255,255,0.08)';
            ctx.lineWidth = 2;
            for (let i=0; i<10; i++) {
                const lx = (i * 43 + frameCount*3) % (V_WIDTH+40) - 20;
                ctx.beginPath(); ctx.moveTo(lx, ((i*97)%V_HEIGHT)); ctx.lineTo(lx, ((i*97)%V_HEIGHT) + 35); ctx.stroke();
            }

            // ambient falling leaves
            leaves.forEach(l => {
                ctx.save();
                ctx.translate(l.x, l.y); ctx.rotate(l.r);
                ctx.globalAlpha = 0.55;
                ctx.fillStyle = kMode ? '#ff8a4c' : '#f97316';
                ctx.beginPath();
                ctx.ellipse(0, 0, l.sz, l.sz*0.5, 0, 0, 7);
                ctx.fill();
                ctx.strokeStyle = 'rgba(0,0,0,0.25)'; ctx.lineWidth = 0.6;
                ctx.beginPath(); ctx.moveTo(-l.sz, 0); ctx.lineTo(l.sz, 0); ctx.stroke();
                ctx.restore();
            });
            ctx.globalAlpha = 1;

            // Render Sasuke Assist Partner
            if (player.sasukeTimer > 0) {
                ctx.save();
                const sasukeX = player.x + (player.side === 0 ? 70 : -70);
                ctx.translate(sasukeX + 20, player.y + 30);
                if (imgReady('sasuke')) {
                    drawTrimmed(images.sasuke, 'sasuke', -SIZE.sasuke.w / 2, -SIZE.sasuke.h * 0.5, SIZE.sasuke.w, SIZE.sasuke.h);
                } else {
                    ctx.fillStyle = '#38bdf8'; ctx.fillRect(-SIZE.sasuke.w * 0.29, -SIZE.sasuke.h * 0.33, SIZE.sasuke.w * 0.58, SIZE.sasuke.h * 0.67);
                }
                ctx.restore();
            }

            particles.forEach((p, i) => {
                ctx.globalAlpha = p.life; ctx.fillStyle = p.c;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.s, 0, 7); ctx.fill();
                p.x += p.vx; p.y += p.vy; p.life -= 0.02;
                if (p.life <= 0) particles.splice(i, 1);
            });
            ctx.globalAlpha = 1;

            floaters.forEach(f => {
                ctx.globalAlpha = Math.max(f.life, 0);
                ctx.fillStyle = f.color;
                ctx.font = "bold 16px 'Permanent Marker', cursive";
                ctx.textAlign = 'center';
                ctx.fillText(f.text, f.x, f.y);
            });
            ctx.globalAlpha = 1;

            entities.forEach(e => {
                ctx.save(); ctx.translate(e.x, e.y);
                if (e.type === 'shuriken') {
                    ctx.rotate(frameCount*0.4); ctx.fillStyle = '#94a3b8';
                    for(let i=0; i<4; i++) { ctx.rotate(Math.PI/2); ctx.fillRect(-18, -2, 36, 4); }
                    ctx.fillStyle = 'rgba(255,255,255,0.8)'; ctx.beginPath(); ctx.arc(0,0,3,0,7); ctx.fill();
                }
                else if (e.type === 'kunai') {
                    ctx.rotate(0.15);
                    ctx.fillStyle = '#475569'; ctx.beginPath(); ctx.moveTo(0, 25); ctx.lineTo(8, 0); ctx.lineTo(-8, 0); ctx.fill();
                    ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 1;
                    ctx.beginPath(); ctx.moveTo(0, 22); ctx.lineTo(0, 3); ctx.stroke();
                }
                else if (e.type === 'shinobi') {
                    if (imgReady('enemyShinobi')) {
                        drawTrimmed(images.enemyShinobi, 'enemyShinobi', -SIZE.enemy.w / 2, -SIZE.enemy.h * 0.5, SIZE.enemy.w, SIZE.enemy.h);
                    } else {
                        ctx.fillStyle = '#64748b'; ctx.fillRect(-SIZE.enemy.w * 0.29, -SIZE.enemy.h * 0.33, SIZE.enemy.w * 0.58, SIZE.enemy.h * 0.67);
                    }
                }
                else if (e.type === 'itachi') {
                    if (e.telegraph) {
                        ctx.save(); ctx.globalAlpha = 0.5 + Math.sin(frameCount*0.6)*0.3;
                        ctx.strokeStyle = '#ff0000'; ctx.lineWidth = 4; ctx.shadowBlur = 20; ctx.shadowColor = '#ff0000';
                        ctx.beginPath(); ctx.arc(0, 0, 45, 0, 7); ctx.stroke(); ctx.restore();
                    }
                    const itachiKey = (e.phase === 2 || e.telegraph) ? 'itachiAttack' : 'itachiBase';
                    if (imgReady(itachiKey)) {
                        drawTrimmed(images[itachiKey], itachiKey, -SIZE.itachi.w / 2, -SIZE.itachi.h * 0.55, SIZE.itachi.w, SIZE.itachi.h);
                    } else {
                        ctx.fillStyle = '#7f1d1d'; ctx.fillRect(-SIZE.itachi.w * 0.28, -SIZE.itachi.h * 0.4, SIZE.itachi.w * 0.56, SIZE.itachi.h * 0.8);
                    }

                    // Boss HP bar
                    ctx.fillStyle = '#222'; ctx.fillRect(-50, -65, 100, 8);
                    ctx.fillStyle = '#ff0000'; ctx.fillRect(-50, -65, (e.hp/e.maxHp)*100, 8);
                    ctx.strokeStyle = '#000'; ctx.lineWidth = 1;
                    for (let n=1; n<4; n++) { ctx.beginPath(); ctx.moveTo(-50+n*25, -65); ctx.lineTo(-50+n*25, -57); ctx.stroke(); }
                }
                else if (e.type === 'rasenshuriken') { ctx.rotate(frameCount*0.6); ctx.fillStyle = '#4facfe'; ctx.shadowBlur = 15; ctx.shadowColor = '#4facfe'; for(let i=0; i<4; i++) { ctx.rotate(Math.PI/2); ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,30,0,1.2); ctx.fill(); } }
                else if (e.type === 'beast_bomb') { ctx.shadowBlur = 30; ctx.shadowColor = '#f00'; ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(0, 0, 35, 0, 7); ctx.fill(); ctx.strokeStyle = '#f00'; ctx.lineWidth = 4; ctx.stroke(); }
                else if (e.type === 'ramen') { ctx.shadowBlur = 18; ctx.shadowColor = '#fff'; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 0, 26, 0, Math.PI); ctx.fill(); ctx.fillStyle = '#f00'; ctx.fillRect(-16, -6, 32, 6); ctx.shadowBlur = 0; }
                else if (e.type === 'scroll') { ctx.shadowBlur = 15; ctx.shadowColor = '#fbbf24'; ctx.fillStyle = '#fbbf24'; ctx.fillRect(-15, -12, 30, 24); ctx.fillStyle = '#991b1b'; ctx.fillRect(-22, -12, 7, 24); ctx.fillRect(15, -12, 7, 24); }
                else if (e.type === 'bandage') { ctx.fillStyle = '#fff'; ctx.fillRect(-18, -10, 36, 20); ctx.fillStyle = '#4facfe'; ctx.fillRect(-3, -10, 6, 20); }
                else if (e.type === 'chidori_senbon') { ctx.shadowBlur = 24; ctx.shadowColor = '#4facfe'; ctx.fillStyle = '#e0f7ff'; ctx.fillRect(-2, -26, 4, 52); }
                ctx.restore();
            });

            if (!player.finisher && player.attackAnim <= 0) {
                const trailSheetKey = kMode ? 'kuramaRun' : 'narutoRun';
                const rw = SIZE.playerRun.w, rh = SIZE.playerRun.h;
                if (imgReady(trailSheetKey)) {
                    const sheet = images[trailSheetKey];
                    const frames = spriteFrames[trailSheetKey] || 1;
                    const frameIndex = Math.floor(frameCount / 6) % frames;
                    const frameWidth = sheet.naturalWidth / frames;
                    const frameHeight = sheet.naturalHeight;
                    player.trail.forEach((t, i) => {
                        const alpha = i * 0.05;
                        if (alpha <= 0) return;
                        ctx.save();
                        ctx.globalAlpha = alpha;
                        { const r = frameSourceRect(trailSheetKey, frameIndex, frameWidth, frameHeight); drawFit(sheet, r.sx, r.sy, r.sw, r.sh, t.x + 20 - rw / 2, t.y + 30 - rh * 0.5, rw, rh); }
                        ctx.restore();
                    });
                }
                ctx.globalAlpha = 1;
            }
            drawPlayer(kMode);

            ctx.restore();

            if (jutsuFlash > 0) {
                ctx.save();
                ctx.globalAlpha = Math.min(jutsuFlash, 0.35);
                ctx.fillStyle = kMode ? '#ff3300' : '#4facfe';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.restore();
            }

            requestAnimationFrame(draw);
        }

        // ============================================================
        // INPUT
        // ============================================================
        function handleAttack() {
            if (state !== 'PLAY' || player.finisher) return;
            if (player.chakra < 20 && player.kuramaMode <= 0) { Sfx.deny(); return; }
            const type = player.kuramaMode > 0 ? 'beast_bomb' : 'rasenshuriken';
            if (player.kuramaMode <= 0) { player.chakra -= 20; chakraFill.style.width = player.chakra + '%'; }
            entities.push({ type, x: player.x + 20, y: player.y });
            spawnPart(player.x + 20, player.y, player.kuramaMode > 0 ? '#f00' : '#4facfe', 15);
            player.attackAnim = player.attackAnimMax;
            jutsuFlash = 1;
            Sfx.jutsu(player.kuramaMode > 0);
        }
        function handleDash() {
            if (state !== 'PLAY' || player.finisher) return;
            player.side = 1 - player.side;
            player.targetX = player.side === 0 ? 60 : V_WIDTH - 100;
            spawnPart(player.x + 20, player.y + 30, '#fff', 8, 6);
            Sfx.dash();
        }

        document.getElementById('btn-dash').addEventListener('touchstart', (e) => { e.preventDefault(); handleDash(); });
        document.getElementById('btn-attack').addEventListener('touchstart', (e) => { e.preventDefault(); handleAttack(); });
        document.getElementById('btn-dash').addEventListener('mousedown', (e) => { e.preventDefault(); handleDash(); });
        document.getElementById('btn-attack').addEventListener('mousedown', (e) => { e.preventDefault(); handleAttack(); });
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') handleDash();
            if (e.code === 'KeyJ' || e.code === 'Enter') handleAttack();
        });
        document.getElementById('start-btn').addEventListener('click', initGame);
        window.addEventListener('resize', resize);
        resize(); draw(); setInterval(update, 1000/60);
    </script>
</body>
