<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Naruto: Shinobi Rush - Ultimate Finale</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap');
        body { margin: 0; overflow: hidden; background: #020205; font-family: 'Permanent Marker', cursive; touch-action: none; }
        canvas { display: block; margin: 0 auto; }
        #ui { position: absolute; top: env(safe-area-inset-top, 20px); left: 0; right: 0; pointer-events: none; padding: 0 20px; z-index: 50; }
        #controls { position: absolute; bottom: env(safe-area-inset-bottom, 30px); left: 0; right: 0; display: flex; justify-content: space-around; z-index: 50; }
        .ctrl-btn {
            width: 85px; height: 85px; border-radius: 50%; border: 3px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.6); color: white; display: flex; flex-direction: column;
            align-items: center; justify-content: center; font-size: 11px; pointer-events: auto;
            backdrop-filter: blur(10px); box-shadow: 0 0 20px rgba(0,0,0,0.5); transition: 0.1s;
            user-select: none; -webkit-tap-highlight-color: transparent;
        }
        .ctrl-btn:active { transform: scale(0.9); border-color: #ff9d00; background: rgba(255, 157, 0, 0.2); }
        #hp-fill { width: 100%; height: 100%; background: linear-gradient(90deg, #ff4d4d, #ff0000); transition: 0.3s; }
        #overlay { position: absolute; inset: 0; background: radial-gradient(circle, rgba(0,0,0,0.85), #000); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; text-align: center; padding: 20px; }
        .glow { text-shadow: 0 0 20px #ff4d4d; }
        #kurama-bar { position: absolute; top: 60px; left: 20px; width: 150px; height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); }
        #kurama-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #ff8000, #ffcc00); box-shadow: 0 0 10px #ff8000; transition: 0.1s; }
        .flash-red { animation: flashRed 0.2s infinite; }
        @keyframes flashRed { 0% { background: #000; } 50% { background: #300; } 100% { background: #000; } }
    </style>
</head>
<body>
    <div id="ui">
        <div class="flex justify-between items-start">
            <div>
                <div class="text-[10px] text-orange-400 uppercase tracking-[0.2em] mb-1">Health</div>
                <div class="w-44 h-4 bg-white/5 border-2 border-white/20 rounded-full overflow-hidden">
                    <div id="hp-fill"></div>
                </div>
                <div id="kurama-bar"><div id="kurama-fill"></div></div>
            </div>
            <div class="text-right">
                <div id="phase-label" class="text-[10px] text-gray-400 uppercase tracking-[0.3em] mb-1">Infiltration</div>
                <div class="text-4xl text-white italic glow"><span id="dist">0</span>M</div>
            </div>
        </div>
    </div>

    <div id="controls">
        <div id="btn-dash" class="ctrl-btn">
            <span class="text-2xl mb-1">⚡</span>
            <span>SHUNSHIN</span>
        </div>
        <div id="btn-attack" class="ctrl-btn" style="border-color: #4facfe;">
            <span class="text-2xl mb-1">🌀</span>
            <span>JUTSU</span>
        </div>
    </div>

    <div id="overlay">
        <h1 id="title-txt" class="text-5xl text-orange-500 mb-2 italic glow">SHINOBI RUSH</h1>
        <p id="desc-txt" class="text-gray-400 mb-10 max-w-xs uppercase tracking-[0.1em]">Tap START to awaken the Will of Fire</p>
        <button id="start-btn" class="bg-orange-600 hover:bg-orange-500 text-white px-12 py-4 rounded-full font-bold tracking-widest transition-all active:scale-95">START MISSION</button>
        <p class="text-[10px] text-gray-600 mt-6 uppercase italic">Procedural "Shinobi Spirit" Theme Enabled</p>
    </div>

    <canvas id="game"></canvas>

    <script>
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioCtx();
        let musicPlaying = false;
        let musicInterval;

        const Music = {
            notes: [220, 247, 261, 330, 349], 
            step: 0,
            playTick: function() {
                const now = audioCtx.currentTime;
                if (this.step % 2 === 0) {
                    const osc = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(55, now);
                    g.gain.setValueAtTime(0.15, now);
                    g.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
                    osc.connect(g);
                    g.connect(audioCtx.destination);
                    osc.start(); osc.stop(now + 0.2);
                }
                if (this.step % 4 === 2) {
                    const noise = audioCtx.createBufferSource();
                    const buffer = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.05, audioCtx.sampleRate);
                    const data = buffer.getChannelData(0);
                    for(let i=0; i<data.length; i++) data[i] = Math.random() * 2 - 1;
                    noise.buffer = buffer;
                    const g = audioCtx.createGain();
                    g.gain.setValueAtTime(0.05, now);
                    g.gain.linearRampToValueAtTime(0, now + 0.05);
                    noise.connect(g);
                    g.connect(audioCtx.destination);
                    noise.start();
                }
                const melodyPattern = [0, 2, 3, 2, 4, 3, 2, 0];
                const noteIdx = melodyPattern[this.step % 8];
                const freq = this.notes[noteIdx] * (this.step % 16 > 8 ? 2 : 1);
                const osc = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(freq, now);
                const lfo = audioCtx.createOscillator();
                lfo.frequency.value = 5;
                const lfoGain = audioCtx.createGain();
                lfoGain.gain.value = 10;
                lfo.connect(lfoGain);
                lfoGain.connect(osc.frequency);
                lfo.start();
                g.gain.setValueAtTime(0.04, now);
                g.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                osc.connect(g);
                g.connect(audioCtx.destination);
                osc.start(); 
                osc.stop(now + 0.4);
                lfo.stop(now + 0.4);
                this.step++;
            },
            start: function() {
                if(musicPlaying) return;
                musicPlaying = true;
                this.step = 0;
                musicInterval = setInterval(() => this.playTick(), 214);
            },
            stop: function() {
                musicPlaying = false;
                clearInterval(musicInterval);
            }
        };

        const Sfx = {
            dash: () => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            },
            jutsu: (isPower) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = isPower ? 'sawtooth' : 'sine';
                osc.frequency.setValueAtTime(isPower ? 100 : 800, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.3);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            },
            hit: () => {
                const bufferSize = audioCtx.sampleRate * 0.1;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;
                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                noise.connect(gain);
                gain.connect(audioCtx.destination);
                noise.start();
            },
            powerup: () => {
                [440, 660, 880].forEach((f, i) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.frequency.setValueAtTime(f, audioCtx.currentTime + i * 0.05);
                    gain.gain.setValueAtTime(0.1, audioCtx.currentTime + i * 0.05);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + i * 0.05 + 0.2);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(audioCtx.currentTime + i * 0.05);
                    osc.stop(audioCtx.currentTime + i * 0.05 + 0.2);
                });
            },
            explosion: () => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(100, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(40, audioCtx.currentTime + 1);
                gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 1);
            }
        };

        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const hpFill = document.getElementById('hp-fill');
        const distTxt = document.getElementById('dist');
        const kuramaFill = document.getElementById('kurama-fill');
        const phaseLabel = document.getElementById('phase-label');
        const overlay = document.getElementById('overlay');

        const V_WIDTH = 400;
        let V_HEIGHT = 800;
        let scale = 1;

        let state = 'MENU';
        let player = {
            x: 60, y: 0, targetX: 60, side: 0, hp: 100,
            kuramaMode: 0, kuramaMax: 400, sasukeTimer: 0, trail: [],
            width: 40, height: 60, finisher: false, finisherX: 0, finisherY: 0, defaultY: 0
        };

        let entities = [];
        let particles = [];
        let bgLines = [];
        let distance = 0;
        let frameCount = 0;
        let shake = 0;
        let itachiRef = null;

        function resize() {
            scale = Math.min(window.innerWidth / V_WIDTH, window.innerHeight / 800);
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            V_HEIGHT = window.innerHeight / scale;
            player.defaultY = V_HEIGHT - 180;
            if (!player.finisher) player.y = player.defaultY;
        }

        function spawnPart(x, y, color, count=5, speed=8) {
            for(let i=0; i<count; i++) {
                particles.push({
                    x, y, vx: (Math.random()-0.5)*speed, vy: (Math.random()-0.5)*speed,
                    life: 1, c: color, s: Math.random()*4 + 2
                });
            }
        }

        function initGame() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            Music.start();
            state = 'PLAY';
            player.hp = 100;
            player.kuramaMode = 0;
            player.sasukeTimer = 0;
            player.finisher = false;
            player.side = 0;
            player.targetX = 60;
            player.x = 60;
            player.y = player.defaultY;
            distance = 0;
            entities = [];
            particles = [];
            itachiRef = null;
            frameCount = 0;
            overlay.style.display = 'none';
            document.body.classList.remove('flash-red');
            phaseLabel.innerText = "Infiltration";
            bgLines = [];
            for(let i=0; i<20; i++) bgLines.push({x: Math.random()*V_WIDTH, y: Math.random()*V_HEIGHT, l: Math.random()*50+20});
        }

        function update() {
            if (state !== 'PLAY') return;
            if (player.finisher) { updateFinisher(); return; }
            frameCount++;
            distance += 1.2;
            if (shake > 0) shake *= 0.85;
            player.x += (player.targetX - player.x) * 0.25;
            player.trail.push({x: player.x, y: player.y});
            if (player.trail.length > 6) player.trail.shift();
            if (player.kuramaMode > 0) {
                player.kuramaMode--;
                kuramaFill.style.width = (player.kuramaMode / player.kuramaMax * 100) + '%';
            } else {
                kuramaFill.style.width = '0%';
            }
            if (player.sasukeTimer > 0) player.sasukeTimer--;
            bgLines.forEach(l => {
                l.y += 25;
                if(l.y > V_HEIGHT) { l.y = -50; l.x = Math.random()*V_WIDTH; }
            });
            if (distance < 1200) {
                if (frameCount % 120 === 0) {
                    const items = ['ramen', 'scroll', 'bandage'];
                    const type = items[Math.floor(Math.random() * items.length)];
                    const laneX = Math.random() > 0.5 ? 60 : 300;
                    entities.push({ type, x: laneX + 20, y: -50 });
                }
                if (frameCount % 40 === 0) {
                    entities.push({ type: 'shinobi', x: Math.random() * 300 + 50, y: -50, hp: 1 });
                    if (Math.random() < 0.25) entities.push({ type: 'shuriken', x: Math.random() * V_WIDTH, y: -50 });
                }
            }
            if (Math.floor(distance) >= 1200 && !itachiRef) {
                itachiRef = { type: 'itachi', x: 200, y: -100, targetX: 200, hp: 300, maxHp: 300, phase: 1 };
                entities.push(itachiRef);
                phaseLabel.innerText = "The Final Confrontation";
                Sfx.powerup();
            }
            if (player.sasukeTimer > 0 && frameCount % 30 === 0) {
                entities.push({ type: 'chidori_senbon', x: player.x + (player.side==0?80:-40), y: player.y });
            }
            for (let i = entities.length - 1; i >= 0; i--) {
                let e = entities[i];
                if (['ramen', 'scroll', 'bandage'].includes(e.type)) {
                    const dx = (player.x + 20) - e.x;
                    const dy = (player.y + 30) - e.y;
                    if (Math.sqrt(dx*dx + dy*dy) < 150) { e.x += dx * 0.15; e.y += dy * 0.15; }
                }
                if (['rasenshuriken', 'beast_bomb', 'chidori_senbon'].includes(e.type)) {
                    e.y -= 25;
                } else if (e.type === 'itachi') {
                    e.y += (150 - e.y) * 0.05;
                    if (frameCount % 60 === 0) e.targetX = 100 + Math.random() * 200;
                    e.x += (e.targetX - e.x) * 0.08;
                    if (frameCount % 50 === 0) {
                        const count = e.hp < 150 ? 5 : 3;
                        for(let k=0; k<count; k++) entities.push({ type: 'kunai', x: e.x + (k - Math.floor(count/2))*40, y: e.y + 30 });
                    }
                } else { e.y += 12; }
                const pdx = (player.x + 20) - e.x;
                const pdy = (player.y + 30) - e.y;
                if (Math.sqrt(pdx*pdx + pdy*pdy) < 45) {
                    if (['shuriken', 'shinobi', 'kunai'].includes(e.type)) {
                        if (player.kuramaMode <= 0) {
                            player.hp -= 15; shake = 15; Sfx.hit();
                            spawnPart(e.x, e.y, '#f00', 10);
                            entities.splice(i, 1);
                        } else {
                            spawnPart(e.x, e.y, '#ff0', 5);
                            entities.splice(i, 1);
                        }
                    } else if (e.type === 'ramen') {
                        player.hp = Math.min(100, player.hp + 40);
                        Sfx.powerup(); entities.splice(i, 1);
                    } else if (e.type === 'scroll') {
                        player.kuramaMode = player.kuramaMax;
                        shake = 10; Sfx.powerup();
                        spawnPart(player.x+20, player.y+30, '#ff8000', 20);
                        entities.splice(i, 1);
                    } else if (e.type === 'bandage') {
                        player.sasukeTimer = 600;
                        Sfx.powerup(); entities.splice(i, 1);
                    }
                }
                if (['rasenshuriken', 'beast_bomb', 'chidori_senbon'].includes(e.type)) {
                    entities.forEach(target => {
                        if (['shinobi', 'itachi'].includes(target.type)) {
                            if (Math.sqrt((e.x - target.x)**2 + (e.y - target.y)**2) < 65) {
                                target.hp -= e.type === 'beast_bomb' ? 60 : (e.type === 'rasenshuriken' ? 25 : 10);
                                e.dead = true;
                                spawnPart(target.x, target.y, '#4facfe', 12);
                                Sfx.hit();
                            }
                        }
                    });
                }
                if (e.type === 'itachi' && e.hp <= 0) { startFinisher(e); entities.splice(i, 1); } 
                else if (e.y < -300 || e.y > V_HEIGHT + 300 || e.hp <= 0 || e.dead) { entities.splice(i, 1); }
            }
            hpFill.style.width = player.hp + '%';
            distTxt.innerText = Math.floor(distance);
            if (player.hp <= 0) gameOver();
        }

        function startFinisher(target) {
            player.finisher = true;
            player.finisherX = target.x;
            player.finisherY = target.y;
            player.finisherStep = 0;
            entities = [];
            document.body.classList.add('flash-red');
            Sfx.powerup();
        }

        function updateFinisher() {
            player.finisherStep++;
            if (player.finisherStep === 60) {
                shake = 80;
                spawnPart(player.finisherX, player.finisherY, '#fff', 200, 30);
                spawnPart(player.finisherX, player.finisherY, '#4facfe', 200, 35);
                document.body.classList.remove('flash-red');
                Sfx.explosion();
            } else if (player.finisherStep < 60) {
                player.x += (player.finisherX - 20 - player.x) * 0.35;
                player.y += (player.finisherY - 30 - player.y) * 0.35;
            } else if (player.finisherStep > 130) { showWinScreen(); }
        }

        function showWinScreen() { state = 'MENU'; Music.stop(); overlay.style.display = 'flex'; document.getElementById('title-txt').innerText = "MISSION SUCCESS"; document.getElementById('title-txt').style.color = "#4facfe"; }
        function gameOver() { state = 'MENU'; Music.stop(); overlay.style.display = 'flex'; document.getElementById('title-txt').innerText = "MISSION FAILED"; document.getElementById('title-txt').style.color = "#ff4d4d"; Sfx.hit(); }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.translate((canvas.width - V_WIDTH * scale) / 2, 0);
            ctx.scale(scale, scale);
            if (shake > 0) ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
            ctx.fillStyle = player.kuramaMode > 0 ? '#100' : '#020208';
            ctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);
            ctx.strokeStyle = player.kuramaMode > 0 ? '#400' : '#1a1a2e';
            ctx.lineWidth = 2;
            bgLines.forEach(l => {
                ctx.beginPath(); ctx.moveTo(l.x, l.y); ctx.lineTo(l.x, l.y + l.l); ctx.stroke();
            });
            particles.forEach((p, i) => {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.c;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.s, 0, 7); ctx.fill();
                p.x += p.vx; p.y += p.vy; p.life -= 0.02;
                if (p.life <= 0) particles.splice(i, 1);
            });
            ctx.globalAlpha = 1;
            entities.forEach(e => {
                ctx.save(); ctx.translate(e.x, e.y);
                if (e.type === 'shuriken') { ctx.rotate(frameCount*0.4); ctx.fillStyle = '#94a3b8'; for(let i=0; i<4; i++) { ctx.rotate(Math.PI/2); ctx.fillRect(-18, -2, 36, 4); } } 
                else if (e.type === 'kunai') { ctx.fillStyle = '#475569'; ctx.beginPath(); ctx.moveTo(0, 25); ctx.lineTo(8, 0); ctx.lineTo(-8, 0); ctx.fill(); } 
                else if (e.type === 'shinobi') { ctx.fillStyle = '#1e293b'; ctx.fillRect(-15, 0, 30, 45); ctx.fillStyle = '#fce2c4'; ctx.beginPath(); ctx.arc(0, -5, 12, 0, 7); ctx.fill(); } 
                else if (e.type === 'itachi') { ctx.shadowBlur = 25; ctx.shadowColor = '#f00'; ctx.fillStyle = '#000'; ctx.beginPath(); ctx.moveTo(-30, 90); ctx.lineTo(30, 90); ctx.lineTo(0, 0); ctx.fill(); ctx.fillStyle = '#fce2c4'; ctx.beginPath(); ctx.arc(0, 18, 12, 0, 7); ctx.fill(); ctx.fillStyle = '#222'; ctx.fillRect(-50, -60, 100, 8); ctx.fillStyle = '#ff0000'; ctx.fillRect(-50, -60, (e.hp/e.maxHp)*100, 8); ctx.shadowBlur = 0; } 
                else if (e.type === 'rasenshuriken') { ctx.rotate(frameCount*0.6); ctx.fillStyle = '#4facfe'; ctx.shadowBlur = 15; ctx.shadowColor = '#4facfe'; for(let i=0; i<4; i++) { ctx.rotate(Math.PI/2); ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,30,0,1.2); ctx.fill(); } } 
                else if (e.type === 'beast_bomb') { ctx.shadowBlur = 30; ctx.shadowColor = '#f00'; ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(0, 0, 35, 0, 7); ctx.fill(); ctx.strokeStyle = '#f00'; ctx.lineWidth = 4; ctx.stroke(); } 
                else if (e.type === 'ramen') { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 0, 20, 0, Math.PI); ctx.fill(); ctx.fillStyle = '#f00'; ctx.fillRect(-12, -5, 24, 4); } 
                else if (e.type === 'scroll') { ctx.shadowBlur = 15; ctx.shadowColor = '#fbbf24'; ctx.fillStyle = '#fbbf24'; ctx.fillRect(-15, -12, 30, 24); ctx.fillStyle = '#991b1b'; ctx.fillRect(-22, -12, 7, 24); ctx.fillRect(15, -12, 7, 24); } 
                else if (e.type === 'bandage') { ctx.fillStyle = '#fff'; ctx.fillRect(-18, -10, 36, 20); ctx.fillStyle = '#4facfe'; ctx.fillRect(-3, -10, 6, 20); } 
                else if (e.type === 'chidori_senbon') { ctx.shadowBlur = 20; ctx.shadowColor = '#4facfe'; ctx.fillStyle = '#fff'; ctx.fillRect(-1.5, -20, 3, 40); }
                ctx.restore();
            });
            ctx.save(); ctx.translate(player.x, player.y);
            if (!player.finisher) { player.trail.forEach((t, i) => { ctx.globalAlpha = i * 0.08; ctx.fillStyle = player.kuramaMode > 0 ? '#f00' : '#f97316'; ctx.fillRect(t.x - player.x, t.y - player.y + 20, 40, 50); }); }
            ctx.globalAlpha = 1; ctx.fillStyle = player.kuramaMode > 0 ? '#991b1b' : '#f97316'; ctx.fillRect(0, 20, 40, 50); ctx.fillStyle = '#fce2c4'; ctx.beginPath(); ctx.arc(20, 10, 16, 0, 7); ctx.fill(); ctx.fillStyle = '#fbbf24'; ctx.fillRect(5, -10, 30, 15);
            if (player.kuramaMode > 0 || player.finisher) { ctx.shadowBlur = 30; ctx.shadowColor = '#4facfe'; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(20, 45, 25 + Math.sin(frameCount*0.2)*8, 0, 7); ctx.fill(); }
            if (player.sasukeTimer > 0) { let sx = player.side === 0 ? 90 : -50; ctx.fillStyle = '#1e1b4b'; ctx.fillRect(sx, 15, 30, 50); ctx.fillStyle = '#818cf8'; ctx.beginPath(); ctx.arc(sx+15, 5, 12, 0, 7); ctx.fill(); }
            ctx.restore(); ctx.restore();
            requestAnimationFrame(draw);
        }

        function handleAttack() { if (state !== 'PLAY' || player.finisher) return; const type = player.kuramaMode > 0 ? 'beast_bomb' : 'rasenshuriken'; entities.push({ type, x: player.x + 20, y: player.y }); spawnPart(player.x + 20, player.y, player.kuramaMode > 0 ? '#f00' : '#4facfe', 15); Sfx.jutsu(player.kuramaMode > 0); }
        function handleDash() { if (state !== 'PLAY' || player.finisher) return; player.side = 1 - player.side; player.targetX = player.side === 0 ? 60 : V_WIDTH - 100; Sfx.dash(); }

        document.getElementById('btn-dash').addEventListener('touchstart', (e) => { e.preventDefault(); handleDash(); });
        document.getElementById('btn-attack').addEventListener('touchstart', (e) => { e.preventDefault(); handleAttack(); });
        document.getElementById('btn-dash').addEventListener('mousedown', (e) => { e.preventDefault(); handleDash(); });
        document.getElementById('btn-attack').addEventListener('mousedown', (e) => { e.preventDefault(); handleAttack(); });
        document.getElementById('start-btn').addEventListener('click', initGame);
        window.addEventListener('resize', resize);
        resize(); draw(); setInterval(update, 1000/60);
    </script>
</body>
</html>
